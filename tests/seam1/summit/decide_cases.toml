# Summit seam-1 decision cases (task 9.9; SPEC.md -> Client 2: Summit Home,
# Decision checks, Creator table). Fake values only: the PO 123456/020/01,
# fake plns, fake staff names, a fake street. Company names and creators
# come from the committed creator table (config/clients/summit.toml), which
# SPEC allows. Never a real Summit PO, address, title or body.
#
# [note] and [lookup] are one fake Note and its MySys lookup that PROCEED
# (Summit Homes Group -> Compactions). The PDF text is reader_cases.toml's
# [po], as both readers read it.
#
# A [[case]] changes only what it mutates:
# - title, attachments, linked replace the Note's;
# - pdf_replace / plumber_replace / pypdf_replace / empty change the PDF
#   text as in reader_cases.toml;
# - search_rows, more_pages, internal_no, project_tasks replace the lookup's.
#
# expect_skip is decide()'s skip reason. Without it, the case PROCEEDs with
# expect_pln, expect_po, expect_creator, expect_previous_task (only on a
# previous-task row) and expect_task_nos (the Compaction Test task numbers
# W2 needs; [] when left out). All written out from SPEC, never computed.

[note]
title = "Summit Homes Group - Lot 1 Fake Street Fakeville - PO: 123456/020/01 - READY"
body = "Fake order table line\nFake line of text\nFake Disclaimer"
attachments = ["fake-123456_020_01.pdf"]
linked = false

[lookup]
more_pages = false
internal_no = "123456"
search_rows = [{ pln = "pln_20001", client_ref_no = "123456", company = "Summit Homes Group" }]
project_tasks = [
  { task_no = "tsk_300001", name = "Site Start", status = "Complete", task_creator = "Fake Staff One" },
]

# --- PROCEED ---

[[case]]
id = "clean"
expect_pln = "pln_20001"
expect_po = "123456/020/01"
expect_creator = "Compactions"

[[case]]
id = "company-names-trimmed-any-case"
title = "  summit HOMES group  - Lot 1 Fake Street Fakeville - PO: 123456/020/01 - ISSUED"
search_rows = [{ pln = "pln_20001", client_ref_no = " 123456 ", company = " SUMMIT homes GROUP " }]
expect_pln = "pln_20001"
expect_po = "123456/020/01"

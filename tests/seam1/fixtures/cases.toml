# --- clean POs ---

[[case]]
id = "p1-clean"
base = "p1"
covers = ["fake-pos-test-config", "house-no-postcode-state"]
expect = { result = "proceed", pln = "pln_10001", po_number = "2600001B/048" }

[[case]]
id = "p2-clean"
base = "p2"
covers = ["fake-pos-test-config", "house-no-postcode-state", "lot-with-letter"]
expect = { result = "proceed", pln = "pln_10002", po_number = "2600002B/048" }

[[case]]
id = "p3-clean"

# Seam-1 decision cases (task 2.1): docs/specs/spec.md -> Seam 1 table plus
# SPEC.md -> Testing Strategy's extra cases. Fake values only: 2600001B-2600003B,
# pln_10001-pln_10003, Sample Lane-style addresses. Never a trial PO's value.
#
# Each [po.<name>] is a fake B1-style PO: its Note snapshot, the PDF's text layer
# as each reader reads it, and the MySys lookup (lean fakes, decisions 29 Oct
# 2026). pdf_text is pdfplumber's text: the layout follows the real B1 PDFs,
# where the Job Address block shares its lines with the Supplier block.
# pypdf_text is pypdf's text of the same PDF (decisions, 2 Nov 2026): pypdf
# reads the columns apart, so the line under "Job Address: Lot <lot>" holds only
# "<street> <suburb> <state>" (the 3 trial PDFs, checked as masked shapes).
#
# A [[case]] names a base and overrides only what it mutates (tables merge,
# everything else replaces). Each list holds [old, new] pairs, and each old
# must occur in the text it changes: pdf_replace changes both texts (a change
# to the PDF itself), plumber_replace only pdf_text, pypdf_replace only
# pypdf_text (one reader reading the PDF differently).
#
# expect is the result of the code-only decide(); "untouched" = not eligible
# at step 0.


covers = ["fake-pos-test-config"]
expect = { result = "proceed", pln = "pln_10003", po_number = "2600003B/048" }

[[case]]
id = "p1-job-address-one-line"
base = "p1"
covers = ["spec-address-example"]
# SPEC.md -> Project address: the must-pass example, on one line
plumber_replace = [
  ["Job Address: Lot 123\nUnit 1, 2 Supplier Road Supplierton WA Sample Lane Sampleville WA",
   "Job Address: Lot 123 / Sample Lane Sampleville WA\nUnit 1, 2 Supplier Road Supplierton WA"],
]
pypdf_replace = [
  ["Job Address: Lot 123\nSample Lane Sampleville WA",
   "Job Address: Lot 123 / Sample Lane Sampleville WA"],
]
expect = { result = "proceed", pln = "pln_10001", po_number = "2600001B/048" }

# --- live-style titles (live-site rules, offline only) ---

[[case]]
id = "p1-live-title"
base = "p1"
covers = ["live-title-config"]
config = { site = "live", title_rule = "live-b1-title", duplicate_ignores_cancelled = false }
note = { title = "[B1 Homes] Order 2600001B/048" }
lookup = { search_rows = [{ pln = "pln_10001", client_ref_no = "2600001B/048", company = "B1 Homes" }], project_internal_no = "2600001B/048" }
expect = { result = "proceed", pln = "pln_10001", po_number = "2600001B/048" }

[[case]]
id = "p2-live-title"
base = "p2"
covers = ["live-title-config"]
config = { site = "live", title_rule = "live-b1-title", duplicate_ignores_cancelled = false }

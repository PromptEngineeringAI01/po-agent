lookup = { search_rows = [{ pln = "pln_10003", client_ref_no = "2600003B/048", company = "B1 Homes" }], project_internal_no = "2600003B/048" }
expect = { result = "proceed", pln = "pln_10003", po_number = "2600003B/048" }

[[case]]
id = "live-title-missing-b1-tag"
base = "p1"
covers = ["live-title-missing-tag"]
# The spec table says NOT_B1, but step 0's live rule already needs the
# [B1 Homes] tag, so the Note is never taken (stricter; no false PROCEED).
config = { site = "live", title_rule = "live-b1-title", duplicate_ignores_cancelled = false }
note = { title = "Order 2600001B/048" }
expect = { result = "untouched" }

[[case]]
id = "live-title-po-not-pdf-po"
base = "p1"
covers = ["live-title-po-differs"]
config = { site = "live", title_rule = "live-b1-title", duplicate_ignores_cancelled = false }

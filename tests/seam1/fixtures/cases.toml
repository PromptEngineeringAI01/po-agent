# Seam-1 decision cases (task 2.1): docs/specs/spec.md -> Seam 1 table plus
# SPEC.md -> Testing Strategy's extra cases. Fake values only: 2600001B-2600003B,
# pln_10001-pln_10003, Sample Lane-style addresses. Never a trial PO's value.
#
# Each [po.<name>] is a fake B1-style PO: its Note snapshot, the PDF's text layer
# (lean fakes, decisions 29 Oct 2026: the layout follows the real B1 PDFs, where
# the Job Address block shares its lines with the Supplier block), the MySys
# lookup and the stub Claude reading. A [[case]] names a base and overrides only
# what it mutates (tables merge, everything else replaces). pdf_replace lists
# [old, new] pairs applied to the base text; each old must occur in it.
#
# expect is the hybrid result; expect_deterministic_only the result with
# reader_mode = deterministic-only (no Claude; every PO that reaches the address
# check skips ADDRESS_UNVERIFIABLE, concern C4). "untouched" = not eligible at
# step 0. Address order assumed (section 4): the PDF Job Address block check
# (ADDRESS_UNVERIFIABLE) runs before the project compare (ADDRESS_MISMATCH).


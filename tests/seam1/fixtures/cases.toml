lookup = { search_rows = [{ pln = "pln_10002", client_ref_no = "2600002B/048", company = "B1 Homes" }], project_internal_no = "2600002B/048" }
expect = { result = "proceed", pln = "pln_10002", po_number = "2600002B/048" }

[[case]]

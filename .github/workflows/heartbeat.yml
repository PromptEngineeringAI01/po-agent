# Missed-heartbeat check (plan task 7.1; docs/macmini-setup.md section 8).
# The Mac Mini's wrapper pings by editing the open po-agent-heartbeat issue
# at the end of every run; scripts/heartbeat_check.py opens one po-agent-alert
# issue (GitHub emails Joey) when no ping has come for more than 2 hours
# inside the schedule. It computes the age from timestamps, so a late or
# skipped firing only delays the check. No secrets but the automatic
# GITHUB_TOKEN; scheduled workflows run on main only.
#
# In practice the check runs about once each weekday afternoon, not every 30
# minutes (decisions, 18 Nov 2026): GitHub's scheduled workflows are
# best-effort, and from 13 to 17 Nov one firing a day came inside the
# schedule (15:47-17:02 Perth); the others came after Perth midnight, where
# the script sees a new day's schedule and checks nothing. So runs that stop
# in the morning are alerted about that afternoon, and runs that stop after
# the day's check, the next weekday afternoon.
name: heartbeat
on:
  schedule:
    # Asks for every 30 minutes, 01:07-11:37 UTC Monday-Friday = 09:07-19:37
    # Perth (UTC+8, no DST), the hours a missed run can be seen in; GitHub
    # delivers far fewer (above). The script decides the exact window, so
    # firings outside it do nothing.
    - cron: "7,37 1-11 * * 1-5"
  workflow_dispatch: # run it by hand from the Actions tab
permissions:
  contents: read # checkout, for the script
  issues: write # read the heartbeat issue, open the alert
concurrency:
  group: heartbeat # two checks at once can't open two alerts
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/heartbeat_check.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

# The check once per PR commit and once per merge to main (decisions, 19 Nov 2026).
# No secrets but the automatic GITHUB_TOKEN.
name: check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true # a newer commit on the same PR or main cancels the older run
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # runs take 10-20 minutes; a hung browser test stops here, not after 6 hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the pushed or PR commits
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium # the guard's tests use a real browser on local HTML
      - run: uv run scripts/check.py
      # v3: v2 ran on Node 20, which GitHub removed from its runners on 16 Sep 2026.
      # The owner is a user account, so no GITLEAKS_LICENSE is needed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1 # same as .pre-commit-config.yaml
          # Findings show in the failed check and job summary only: no SARIF
          # artifact (it would hold the secret) and no PR comment.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
  # The mechanical half of /verify-pr (audit fix #2, PR 161), PRs only.
  # Advisory: its own job, not the required `check` status, so a false
  # positive (say, a helper of ours named `check`) never blocks a merge and
  # never skips gitleaks. A PR body edit doesn't re-run it, and it runs the
  # PR's own copy of the script: /verify-pr's local run from main is the one
  # that counts.
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the script diffs against its merge base with origin/main
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run scripts/verify_pr.py "$HEAD_SHA" --pr "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

# The check on every push and PR. No secrets but the automatic GITHUB_TOKEN.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the pushed or PR commits
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium # the guard's tests use a real browser on local HTML
      - run: uv run scripts/check.py
      # v3: v2 ran on Node 20, which GitHub removed from its runners on 16 Sep 2026.
      # The owner is a user account, so no GITLEAKS_LICENSE is needed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1 # same as .pre-commit-config.yaml
          # Findings show in the failed check and job summary only: no SARIF
          # artifact (it would hold the secret) and no PR comment.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

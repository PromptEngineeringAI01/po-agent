# Live profile (SPEC.md -> Project Structure; decisions, 10 Nov 2026, live
# profile). No secrets here: they come from poagent's Keychain at run time
# (the live MySys pair; Joey sets them by hand).
# Only Joey runs the agent on live, on the Mac Mini (CLAUDE.md Must never #3).
site = "live"
base_url = "https://prompt.mysys.com.au/index.php?option=com_cweb&view=management&tmpl=component"
pool_name = "PO Allocation Pool"
agent_user_name = "Agent 1 (MySys Only)"
title_rule = "live-b1-title"
enabled = false                   # kill switch, read from main: committed off; one PR flips it just before the live spike (G.5), then the production tag moves to that merge commit (the agent reads the tag's copy)
duplicate_ignores_cancelled = false   # every task status counts on live
max_notes_per_run = 1             # one watched PO per run (G.7); 10 for hourly runs (G.8), its own PR
max_run_minutes = 12
run_window = { days = "Mon-Fri", start = "07:00", end = "18:00", tz = "Australia/Perth" }
stale_read_by_agent = true        # live lists 4 pages of Pending Notes at All Users: read only the agent's
project_document_type = "Client Documents"   # W2: live files a PO Documents upload as Type Client Documents
trace_dir = "~/Library/Logs/po-agent/trace"   # the safe trace (7.3), as on test

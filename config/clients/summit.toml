name = "Summit Easystart"
aliases = ["New Gen and EasyStart", "New Generation and EasyStart"]   # the second: older Note titles (Joey, 26 Nov 2026)
creator = "NH Sub Floor"

[[company]]
name = "Summit Homes Group"
creator = "Compactions"

[[company]]
name = "Summit New Homes"
creator = "NH Sub Floor"

